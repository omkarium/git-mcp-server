[package]
name = "git-mcp-server"
version = "0.1.0"
edition = "2021"
authors = ["Venkatesh Omkaram"]
notices = ["Copyright (c) 2026 Venkatesh Omkaram"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/omkarium/git-mcp-server"
homepage = "https://github.com/omkarium/git-mcp-server"
readme = "README.md"
keywords = ["mcp", "code-intelligence", "azdo", "github", "ai"]
categories = ["development-tools", "command-line-interface"]

[dependencies]
rust-mcp-sdk = { version = "0.8.3", features = ["server"] }
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
